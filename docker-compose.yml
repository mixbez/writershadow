version: '3.8'

services:
  app:
    build: .
    container_name: writershadow_app
    networks:
      - comparity_default
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://comparity:comparity_pass@comparity-postgres-1:5432/writershadow
      REDIS_URL: redis://comparity-redis-1:6379
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      OWNER_CONTACT: ${OWNER_CONTACT}
    ports:
      - "3001:3001"
    restart: unless-stopped

networks:
  comparity_default:
    external: true
